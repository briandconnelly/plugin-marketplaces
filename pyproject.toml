[project]
name = "plugin-marketplaces"
version = "0.1.0"
description = "Agent skill for creating and maintaining user-hosted plugin marketplaces"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["jsonschema>=4.23"]

[project.scripts]
check-marketplace = "mpcheck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skills/plugin-marketplaces/scripts/mpcheck"]

[dependency-groups]
dev = ["pytest>=8.3", "pyyaml>=6.0", "ruff", "ty"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/plugin-marketplaces/scripts", "tests", "tests/eval", "tools"]
markers = ["live: runs the real claude, codex, and copilot CLIs (slow)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
extend-exclude = ["*.md", "docs/research"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # the formatter owns line length; long message strings stay intact

[tool.ty.environment]
# the same import roots pytest uses, so a plain `uv run ty check` sees every module
extra-paths = ["skills/plugin-marketplaces/scripts", "tests", "tests/eval", "tools"]
